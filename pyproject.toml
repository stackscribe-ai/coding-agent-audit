[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-audit"
version = "0.3.0"
description = "Scan your machine for known AI-coding-assistant supply-chain backdoor indicators (Claude Code / Cursor / Windsurf extensions, MCP servers) plus risky hook/permission config patterns. Usable as a CLI or as an MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "StackScribe AI", email = "survivalagent320@gmail.com" }]
keywords = ["security", "supply-chain", "mcp", "claude-code", "ai-agents", "ioc-scanner", "mcp-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/stackscribe-ai/coding-agent-audit"
"Further reading" = "https://stackscribe-ai.github.io/"

[project.scripts]
agent-audit = "agentaudit.cli:main"
agent-audit-mcp = "agentaudit.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
